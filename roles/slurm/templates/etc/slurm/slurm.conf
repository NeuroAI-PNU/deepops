#
# Example slurm.conf file generated by DeepOps. 
#
# Slurm provides configurator.html
# (in doc/html) to build a configuration file customized
# for your environment.
#
# See the slurm.conf man page for more information.

# Define a name for the cluster
ClusterName={{ slurm_cluster_name }}

# Configure the controllers
{% if slurm_enable_ha %}
{% for node_name in groups['slurm-master'] %}
SlurmctldHost={{ node_name }}
{% endfor %}
StateSaveLocation={{ slurm_ha_state_save_location }}
{% else %}
SlurmctldHost={{ groups['slurm-master'][0] }}
StateSaveLocation=/var/spool/slurm/ctld
{% endif %}

# Basic configuration
SlurmUser={{ slurm_username }}
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
#JobCredentialPrivateKey=
#JobCredentialPublicCertificate=
SlurmdSpoolDir=/var/spool/slurm/d
SwitchType=switch/none
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid
ProctrackType=proctrack/cgroup
PluginDir={{ slurm_install_prefix }}/lib/slurm
#FirstJobId=
#MaxJobCount=
#PlugStackConfig=
#PropagatePrioProcess=
#PropagateResourceLimits=
#PropagateResourceLimitsExcept=
PropagateResourceLimitsExcept=MEMLOCK

# Basic job behavior
ReturnToService={{ slurm_return_to_service }}
RebootProgram="{{ slurm_reboot_program }}"
ResumeTimeout={{ slurm_resume_timeout }}

{% if slurm_include_pmix %}
# Use PMIX as our default MPI configuration
MpiDefault=pmix
{% endif %}

# Prolog/epilog config
{% if slurm_contain_ssh is defined %}
PrologFlags=Alloc,Serial,Contain
{% else %}
PrologFlags=Alloc,Serial
{% endif %}
{% if slurm_enable_prolog_epilog %}
Prolog={{ slurm_config_dir }}/prolog.sh
Epilog={{ slurm_config_dir }}/epilog.sh
TaskProlog={{ slurm_config_dir }}/task_prolog.sh
{% endif %}
#SrunProlog=
#SrunEpilog=
#TaskEpilog=

{% if slurm_health_check_program is defined %}
# Health checking
HealthCheckProgram={{ slurm_health_check_program }}
HealthCheckInterval=300
HealthCheckNodeState=IDLE
{% endif %}

# Mail program to use
MailProg=/usr/bin/s-nail

TaskPlugin=affinity,cgroup
#TrackWCKey=no
#TreeWidth=50
#TmpFS=
#UsePAM=

# TIMERS
SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

# SCHEDULING
SchedulerType=sched/backfill
#SchedulerAuth=
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory,CR_CORE_DEFAULT_DIST_BLOCK,CR_ONE_TASK_PER_CORE

# PRIORITY
PriorityType=priority/multifactor
PriorityDecayHalfLife=1-0
PriorityUsageResetPeriod=MONTHLY
PriorityWeightFairshare=100000
PriorityWeightAge=2000
PriorityWeightPartition=10000
PriorityWeightJobSize=1000
PriorityMaxAge=1-0

# LOGGING
SlurmctldDebug=3
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=3
SlurmdLogFile=/var/log/slurm/slurmd.log
JobCompType=jobcomp/none
#JobCompLoc=

# ACCOUNTING
JobAcctGatherType=jobacct_gather/cgroup
#JobAcctGatherFrequency=30
{% if slurm_manage_gpus %}
AccountingStorageTRES={{ slurm_accounting_storage_tres | default('gres/gpu') }}
{% endif %}
#DebugFlags=CPU_Bind,gres
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost={{ groups["slurm-master"][0] }}
#AccountingStorageLoc=
{% if slurm_accounting_storage_enforce is defined %}
AccountingStorageEnforce={{ slurm_accounting_storage_enforce }}
{% else %}
#AccountingStorageEnforce=associations,limits,qos
{% endif %}
AccountingStorageUser={{ slurm_db_username }}
AccountingStoragePass=/var/run/munge/munge.socket.2

# COMPUTE NODES
{% if slurm_manage_gpus %}
GresTypes={{ slurm_gres_types | default('gpu') }}
{% endif %}
{% for node_name in groups['slurm-node'] %}
{% set memory =  hostvars[node_name]["ansible_local"]["memory"] -%}
{# If the custom fact failed JSON parsing Ansible hands us a string;
   parse it here so a bad fact fails loudly instead of with an opaque
   attribute error on total_mb. -#}
{% if memory is string %}{% set memory = memory | from_json -%}{% endif -%}
{# A node whose CPU topology the custom fact cannot describe correctly (e.g. a
   hybrid P-core/E-core CPU) can override it with slurm_cpu_topology_override. -#}
{% set cpu_topology =  hostvars[node_name]["slurm_cpu_topology_override"] | default(hostvars[node_name]["ansible_local"]["topology"]["cpu_topology"]) -%}
{% set gpu_topology =  hostvars[node_name]["ansible_local"]["topology"]["gpu_topology"] -%}
{# slurm_gpu_shards is per GPU, so the node total scales with the GPU count. -#}
{% set node_shards = hostvars[node_name]["slurm_gpu_shards"] is defined and (hostvars[node_name]["slurm_gpu_shards"]|int * gpu_topology|count) -%}
    NodeName={{ node_name }}{{ " " -}}
    {% if slurm_manage_gpus %} {%- if gpu_topology|count %} Gres=gpu:{{ gpu_topology|count }}{% if node_shards %},shard:{{ node_shards }}{% endif %} {% endif -%} {% endif %}
    CPUs={{ cpu_topology.logical_cpus|int }}{{ " " -}}
    Sockets={{ cpu_topology.sockets|int }}{{ " " -}}
    CoresPerSocket={{ cpu_topology.cores_per_socket|int }}{{ " " -}}
    ThreadsPerCore={{ cpu_topology.threads_per_core }}{{ " " -}}
    Procs={{ cpu_topology.sockets|int * cpu_topology.cores_per_socket|int }}{{ " " -}}
    RealMemory={{ memory.total_mb|int }}{{ " " -}}
    {% if hostvars[node_name]["slurm_node_features"] is defined %}Features={{ hostvars[node_name]["slurm_node_features"] }} {% endif -%}
    State=UNKNOWN
{% endfor %}

# Partitions are defined by the slurm_partitions variable so that scheduling
# policy lives in the DeepOps config rather than in this role.
# TODO: set DefMemPerCPU = TotalMemory / LogicalCPUs
{% if slurm_partitions is defined %}
{% for part in slurm_partitions %}
PartitionName={{ part.name }} Nodes={{ part.nodes | default('ALL') }} DefMemPerCPU=0 State=UP OverSubscribe=NO MaxTime={{ part.max_time | default('INFINITE') }}{{ ' DefaultTime=' ~ part.default_time if part.default_time is defined else '' }}{{ ' Priority=' ~ part.priority if part.priority is defined else '' }} Default={{ 'YES' if part.default | default(false) else 'NO' }}{{ ' QOS=' ~ part.qos if part.qos is defined else '' }}{{ ' ' ~ part.extra if part.extra is defined else '' }}{{ ' # ' ~ part.comment if part.comment is defined else '' }}
{% endfor %}
{% else %}
{% set slurm_oversubscribe = (slurm_manage_gpus == true)|ternary('NO', 'EXCLUSIVE') %}
PartitionName=batch Nodes=ALL Default=YES DefMemPerCPU=0 State=UP OverSubscribe={{ slurm_oversubscribe }} {%- if slurm_max_job_timelimit is defined %} MaxTime={{ slurm_max_job_timelimit }} {%- else %} MaxTime=INFINITE {% endif -%} {%- if slurm_default_job_timelimit is defined %} DefaultTime={{ slurm_default_job_timelimit }} {% endif -%}
{% endif %}
