{% if slurm_autodetect_nvml -%}
AutoDetect=nvml
{% else -%}
{% set cpu_topology = ansible_local["topology"]["cpu_topology"] -%}
{% set gpu_topology = ansible_local["topology"]["gpu_topology"] -%}
{% for affinity in gpu_topology %}
Name=gpu File=/dev/nvidia{{ loop.index0 }} Cores={{ affinity }}
{% endfor %}
{% endif -%}
{% if slurm_gpu_shards is defined %}
{# slurm_gpu_shards is per GPU: emit one shard line for each GPU on the node. #}
{% for gpu in ansible_local["topology"]["gpu_topology"] %}
Name=shard Count={{ slurm_gpu_shards }} File=/dev/nvidia{{ loop.index0 }}
{% endfor %}
{% endif %}
