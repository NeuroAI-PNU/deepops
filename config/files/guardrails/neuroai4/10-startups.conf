# 2026-08-04: raised after an incident where sshd hit the default MaxStartups
# (10:30:100) and dropped connections for ~7 minutes, which users experienced as
# "the server is down". Root cause was stalled LDAP lookups making every login sit
# in the unauthenticated state; a single client's IDE/Remote-SSH reconnect storm can
# fill 10 slots on its own. PerSourceMaxStartups keeps one host from starving others.
MaxStartups 30:30:200
PerSourceMaxStartups 10
# Free a stalled slot sooner (LDAP now fails fast in ~3-5s, so 2m was overly generous).
LoginGraceTime 60
