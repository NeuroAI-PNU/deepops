# 2026-09-13: neuroai4 is the LOGIN node and a short-partition compute node.
# slurm.conf reserves 64 GB (MemSpecLimit) for interactive users, but jobs that request no
# memory are not accounted. This cap sits on the parent of every job cgroup and makes the
# reservation real: RealMemory 122287 MB - 65536 MB = ~56 GB for all jobs together.
[Scope]
MemoryHigh=52G
MemoryMax=56G
MemorySwapMax=0
