# 2026-09-13: neuroai4 is the login node. Slurm gets 32 of 44 threads (CoreSpecCount=6);
# the 12 reserved threads are for interactive use. Cap each user at 12 threads so one
# interactive run cannot take the whole box (a 40-core interactive run was observed on the
# head node in 2026-08/09). Heavier work goes through sbatch/salloc.
[Slice]
CPUQuota=1200%
