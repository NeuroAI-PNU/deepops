# 2026-08-04: cap per-user memory on this head node.
#
# A runaway language_server (Antigravity IDE) grew to 113 GB anon-RSS on a 124 GB
# box, exhausted the 2 GB swap, and pushed the kernel into failing GFP_NORETRY
# allocations. RCU's fill_page_cache_func then spun retrying without sleeping and
# starved the workqueues, so journald/sshd/etc. could no longer complete work - the
# machine looked dead with CPU idle and had to be power-cycled twice.
#
# 2026-08-24: raised from MemoryHigh=24G / MemoryMax=32G.
#
# MemoryHigh/MemoryMax count PAGE CACHE, not just anon, so at 24G the throttle was
# firing on ordinary file reads rather than on the runaway it was meant to catch:
#   jeongin    current 22.6G but only 5.1G anon (14.2G reclaimable cache) - 259,394 throttles
#   keum9639   ~0G anon                                                   - 141,566 throttles
#   eunjin     ~0G anon                                                   -  40,139 throttles
# Meanwhile the host had 107Gi available and MemoryMax had NEVER fired: max events
# were 0 for every single user. So the cheap protection was idle while the expensive
# one punished normal I/O by capping each user's page cache at 24G.
#
# The hazard being guarded against is ANON runaway, and MemoryMax still covers it:
# under pressure the kernel reclaims cache first, so Max effectively bounds anon.
# Residual risk: two users at 64G each would exceed 124G. The 2026-08-04 incident was
# a single process, which Max=64G would have contained with 60G to spare. Current
# total anon across all users is ~12G. If a two-user runaway ever happens, lower Max
# or adopt systemd-oomd.
[Slice]
MemoryHigh=48G
MemoryMax=64G
# Keep one user from eating the whole (small) swapfile and taking away the kernel's
# reclaim headroom, which is what turned a single bad process into a host-wide stall.
MemorySwapMax=1G
