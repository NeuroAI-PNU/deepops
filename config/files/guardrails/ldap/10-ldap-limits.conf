# 2026-09-13: ldap is the NFS/LDAP/slurmctld host AND a cpu-partition compute node.
# These caps sit on the parent of every Slurm job cgroup (job_* live under this scope)
# and hold regardless of what a job requested or what slurm.conf says.
#
# IO: a local job can drive md126 far harder than any 1G NFS client (a single grep read
# 69 GB and stalled every node on 2026-09-11). Cap job IO on md126 so nfsd keeps headroom.
# Start conservative; tune after the commissioning test.
[Scope]
IOReadBandwidthMax=/dev/md126 100M
IOWriteBandwidthMax=/dev/md126 100M
# Memory: RealMemory 127789 MB; slurm.conf reserves 40 GB via MemSpecLimit, but jobs that
# request no memory are not accounted. Hard backstop so slapd/slurmctld/nfsd never get OOM-killed.
MemoryHigh=76G
MemoryMax=80G
MemorySwapMax=0
