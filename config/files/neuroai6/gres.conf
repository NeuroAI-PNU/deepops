# neuroai6 (2026-11-18): both RTX PRO 6000 Blackwell cards in MIG mode, 4x 1g.24gb each = 8 slices, no shards.
# All devices share one type, so NVML autodetection alone is enough (no cap-file pinning, survives
# changed MIG minor numbers). The layout is recreated at boot by nvidia-mig-setup.service.
AutoDetect=nvml
