# neuroai6 (2026-11-18): GPU0 whole card + 4 shards; GPU1 = MIG 4x 1g.24gb (no shards on MIG).
# Types are the exact names NVML reports. Short names (e.g. rtx_pro_6000) get substring-matched onto a
# MIG slice by slurmd and both devices are then ignored. MIG cap files assume GPU instances 3-6, which
# /usr/local/sbin/nvidia-mig-setup.sh recreates at boot in the same order.
AutoDetect=nvml
Name=gpu Type=nvidia_rtx_pro_6000_blackwell_server_edition_1g.24gb MultipleFiles=/dev/nvidia1,/dev/nvidia-caps/nvidia-cap165,/dev/nvidia-caps/nvidia-cap166
Name=gpu Type=nvidia_rtx_pro_6000_blackwell_server_edition_1g.24gb MultipleFiles=/dev/nvidia1,/dev/nvidia-caps/nvidia-cap174,/dev/nvidia-caps/nvidia-cap175
Name=gpu Type=nvidia_rtx_pro_6000_blackwell_server_edition_1g.24gb MultipleFiles=/dev/nvidia1,/dev/nvidia-caps/nvidia-cap183,/dev/nvidia-caps/nvidia-cap184
Name=gpu Type=nvidia_rtx_pro_6000_blackwell_server_edition_1g.24gb MultipleFiles=/dev/nvidia1,/dev/nvidia-caps/nvidia-cap192,/dev/nvidia-caps/nvidia-cap193
Name=gpu Type=nvidia_rtx_pro_6000_blackwell_server_edition File=/dev/nvidia0
Name=shard Count=4 File=/dev/nvidia0
