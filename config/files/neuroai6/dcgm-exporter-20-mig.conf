# neuroai6 (2026-11-18): GPU1 is in MIG mode. The exporter's own embedded nv-hostengine fails inside the
# container ("CacheManager Init Failed. Error: -17"; /dev/nvidia-caps is not passed in, and
# NVIDIA_MIG_MONITOR_DEVICES=all did not change that with nvidia-container-toolkit 1.20).
# Instead the exporter talks to the host's nv-hostengine (nvidia-dcgm.service, 127.0.0.1:5555), which
# sees the MIG instances. Host network so localhost reaches it; same :9400 for Prometheus.
[Unit]
After=nvidia-dcgm.service
Wants=nvidia-dcgm.service

[Service]
ExecStart=
ExecStart=/usr/bin/docker run --rm --runtime=nvidia --gpus all --network host --cpus="0.5" --name %n nvcr.io/nvidia/k8s/dcgm-exporter:4.4.0-4.5.0-ubuntu22.04 -r localhost:5555
